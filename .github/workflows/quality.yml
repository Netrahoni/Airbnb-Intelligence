name: Project Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and recommendation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile application and Python modules
        run: python -m compileall -q app.py src scripts tests

      - name: Run recommendation tests
        run: python tests/test_recommendations.py

      - name: Run Streamlit dashboard smoke tests
        run: python -m unittest discover -s tests -p "test_dashboard_smoke.py" -v

      - name: Run isolated quality test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check dependency consistency
        run: python -m pip check
